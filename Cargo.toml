[workspace]
resolver = "3"
members = [
    "crates/parsmith",
    "crates/parsmith-py",
    "crates/parsmith-js",
    "crates/parsmith-wasm",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["vypivshiy"]
repository = "https://github.com/vypivshiy/parsmith"
homepage = "https://github.com/vypivshiy/parsmith"
keywords = ["kdl", "schema", "scraper", "codegen", "parser"]
categories = ["compilers", "parser-implementations", "command-line-utilities", "web-programming"]

[workspace.dependencies]
parsmith = { version = "1.0.0", path = "crates/parsmith", default-features = false }
kdl = "6.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = { version = "2.7", features = ["serde"] }
thiserror = "2.0"
strsim = "0.11"
cssparser = "0.31"
regex-syntax = "0.8"
clap = { version = "4.5", features = ["derive"] }
pyo3 = { version = "0.24", features = ["abi3-py310"] }
napi = { version = "2.16", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2.16"
napi-build = "2.1"
wasm-bindgen = "0.2"
insta = { version = "1.42", features = ["yaml", "json"] }
