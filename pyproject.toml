[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "parsmith"
version = "1.3.0"
description = "Universal Rust compiler, linter, and multi-target codegen engine for KDL 2.0 Schema DSL v2.1"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "vypivshiy" }]
keywords = ["kdl", "schema", "scraper", "codegen", "parser", "rest", "html"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/vypivshiy/parsmith"
Repository = "https://github.com/vypivshiy/parsmith"
Issues = "https://github.com/vypivshiy/parsmith/issues"

[dependency-groups]
dev = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "cssselect>=1.2",
    "httpx>=0.27",
    "lxml>=5.0",
    "maturin>=1.7,<2.0",
    "mypy>=1.11",
    "parsel>=1.9",
    "pytest>=8.0",
    "requests>=2.31",
    "selectolax>=0.3.27",
    "types-beautifulsoup4",
    "types-requests",
]
release = [
    "maturin>=1.7,<2.0",
    "ziglang>=0.13",
]

[tool.maturin]
manifest-path = "crates/parsmith-py/Cargo.toml"
python-source = "python"
module-name = "parsmith._parsmith"
features = ["pyo3/extension-module"]
exclude = [
    "python/parsmith/*.pyd",
    "python/parsmith/*.pdb",
    "python/parsmith/*.so",
    "python/parsmith/*.dylib",
    "Release/**",
    "playground/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["python", "tests"]
mypy_path = ["python"]

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true
